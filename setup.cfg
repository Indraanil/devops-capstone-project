[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:report]
show_missing = True

[flake8]
per-file-ignores =
    */__init__.py: F401 E402
max-line-length = 127

[pylint]
max-line-length = 127

[pylint.messages control]
disable = C0301, C0103, R0903, W0511
